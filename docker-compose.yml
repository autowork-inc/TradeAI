services:
  # Стакан (сбор истории): профиль `collectors`, `docker compose --profile collectors up -d depth-stream`.
  # Работает постоянно. Выходит каждые 24 ч (плановый разрыв Binance) и при любом сбое;
  # `restart: always` поднимает заново. При HTTP 429/418 процесс сам выдерживает Retry-After
  # ДО выхода с кодом 2, поэтому мгновенный перезапуск бан не продлевает.
  depth-stream:
    build: .
    command: ["python", "-m", "collectors.depth_stream"]
    restart: always
    profiles: ["collectors"]
    stop_grace_period: 10s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Свечи: разовая докачка (запускать вручную или по расписанию):
  #   docker compose run --rm klines-downloader
  # Автоперезапуск отключён: после 429/418 повторять нужно осознанно.
  klines-downloader:
    build: .
    command: ["python", "-m", "collectors.klines_downloader"]
    restart: "no"
    profiles: ["jobs"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Боевой контур (Этап 8, testnet): ЕДИНСТВЕННЫЙ сервис без профиля, поэтому `docker compose up -d` стартует его.
  #   docker compose up -d
  #   docker compose run --rm live-run python -m scripts.live_run --dry-run --model-path out/ridge_model.json
  # restart: "no" намеренно: код 4 (Safe Mode) и код 2 (бан) требуют решения оператора, автоперезапуск
  # только крутил бы цикл «старт - отказ». Защёлка .safe_mode и стейт живут в ./data на хосте.
  live-run:
    build: .
    command: ["python", "-m", "scripts.live_run", "--model-path", "out/ridge_model.json"]
    restart: "no"
    stop_grace_period: 15s
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./out:/app/out

  # Фандинг: разовая докачка закрытых ставок (новая запись появляется раз в 8 ч):
  #   docker compose run --rm funding-downloader
  # Автоперезапуск отключён по той же причине, что и у свечей. Замок экземпляра свой
  # (.instance_lock.funding_downloader), поэтому задача не мешает свечам и стакану.
  funding-downloader:
    build: .
    command: ["python", "-m", "collectors.funding_downloader"]
    restart: "no"
    profiles: ["jobs"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # PostgreSQL для Shadow Mode (Этап 5): сделки, частичные закрытия, снапшоты, журнал состояний (схема - persistence/schema.py,
  # применяется самим shadow-run при старте, миграции версионированы). Только в профиле `shadow`: обычный `docker compose up -d`
  # (live-run) его не трогает.
  #   * данные - в именованном томе `pgdata` (переживает пересоздание контейнера; `docker compose down` его НЕ удаляет, `down -v` - удалит);
  #   * порт НАРУЖУ не публикуется: к базе ходит только shadow-run по внутренней сети compose; доступ человека - `deploy/shadow.sh psql`;
  #   * пароль - POSTGRES_PASSWORD из .env.shadow (создаёт deploy/shadow.sh; в образ и в git он не попадает). Пустой пароль =
  #     контейнер не стартует (Postgres откажется инициализировать базу), это намеренно;
  #   * резервная копия: `deploy/shadow.sh backup` (pg_dump в ./backups).
  postgres:
    image: postgres:16-alpine
    profiles: ["shadow", "live"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: tradeai
      POSTGRES_USER: tradeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g  # было 512m / 1 CPU: запись пяти стратегий и аналитические запросы клиента
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeai -d tradeai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Shadow Mode (Этап 3, D5): пять параллельных стратегий (SMC_Pro_Trend, SMC_Counter_Trend, OBI_Breakout, ICT_Killzones, VWAP_Reversion) на РЕАЛЬНОМ рынке, ордера не отправляются.
  #   deploy/shadow.sh up                                     # на сервере: пароль БД, сборка, старт postgres + shadow-run
  #   docker compose --env-file .env.shadow up -d --build postgres shadow-run     # то же вручную (live-run не затрагивается)
  #   docker compose --env-file .env.shadow logs -f shadow-run                    # сводка раз в час, события сделок
  #   docker compose --env-file .env.shadow stop shadow-run                       # остановка; журнал - ./data/shadow/shadow_events.jsonl, сделки - в БД
  # Монеты - config.SHADOW_SYMBOLS (BTC, ETH); нужен доступ к fstream.binance.com (публичные данные, ключей нет:
  # свечи и тики - /market/stream, стакан depth10@500ms для OBI_Breakout - /public/stream).
  # Изоляция от боевого контура:
  #   * профиль `shadow`: обычный `docker compose up -d` его не стартует, а запуск shadow не трогает live-run;
  #   * env_file НАМЕРЕННО нет: контейнер не получает ключей API (и .env с профилем testnet) - торговать не может физически;
  #   * BINANCE_PROFILE=mainnet: публичные данные реального рынка (REST /klines, /time и WS /market/stream);
  #   * свой каталог данных (TRADING_DATA_DIR): собственные .instance_lock, .ban_lock, журнал - замки live-run не пересекаются;
  #   * падение любой стратегии роняет только этот контейнер (R1: Fail-Fast); перезапуск on-failure, не более 20 подряд быстрых
  #     падений (код 3 - ошибка конфигурации, код 2 - бан биржи: бесконечный цикл «старт-отказ» не нужен);
  #   * файловая система только для чтения, без привилегий; лимитов памяти и CPU нет (сервер 6 ядер / 8 ГБ).
  shadow-run:
    build: .
    command: ["python", "-m", "scripts.shadow_run"]
    profiles: ["shadow"]
    restart: on-failure:20
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BINANCE_PROFILE: mainnet
      TRADING_DATA_DIR: /app/data/shadow
      TRADING_LOG_DIR: /app/logs/shadow
      # Этап 5: сделки пишутся в PostgreSQL (внутренняя сеть compose, имя хоста = имя сервиса). Пароль - только из .env.shadow.
      DATABASE_URL: postgresql://tradeai:${POSTGRES_PASSWORD:-}@postgres:5432/tradeai
      # Данные Forex/металлов (EURUSD, XAUUSD, XAGUSD) идут из cTrader, а не с Binance. Ключи задаются ТОЛЬКО в .env.shadow на сервере (в образ/архив/git не попадают);
      # пусто - MT5-символы пропускаются, процесс работает по крипте. Для Shadow достаточно токена только на чтение рыночных данных (торговые права не нужны).
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
      CTRADER_ACCOUNT_ID: ${CTRADER_ACCOUNT_ID:-}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN:-}
      CTRADER_REFRESH_TOKEN: ${CTRADER_REFRESH_TOKEN:-}
      CTRADER_ENV: ${CTRADER_ENV:-auto}
      MT5_SYMBOL_MAP: ${MT5_SYMBOL_MAP:-}
    volumes:
      - ./data/shadow:/app/data/shadow
      - ./logs/shadow:/app/logs/shadow
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Лимитов памяти и CPU НЕТ (2026-10-11, решение пользователя: сервер 6 ядер / 8 ГБ NVMe, пять стратегий и поток стакана).
    healthcheck:
      # «пульс»: основной цикл дописывает метку времени каждую секунду; свежее 120 с - процесс жив и получает данные
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/app/data/shadow/.shadow_heartbeat') < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # БОЕВОЙ контур (профиль `live`; решение пользователя 2026-10-14): тот же процесс shadow_run, но TRADE_MODE=live - пять стратегий по-прежнему
  # считают виртуальные сделки, а одобренные (APPROVED_STRATEGIES) дополнительно исполняются на Binance Futures. Размер ФИКСИРОВАН: маржа
  # LIVE_MARGIN_USDT x плечо LIVE_LEVERAGE (10 x 10 = 100 USDT), суточный лимит убытка LIVE_DAILY_LOSS_LIMIT_USDT (50 USDT), не более
  # LIVE_MAX_OPEN_POSITIONS (4) одновременных реальных позиций - остальные сигналы остаются виртуальными. Свои каталоги состояния и логов
  # (./data/live, ./logs/live: состояние боевых ордеров, защёлки, пульс не смешиваются с shadow-run). ВАЖНО: НЕ запускать одновременно с shadow-run -
  # оба пишут виртуальные сделки в одну БД (уникальный индекс trades_one_active_per_key уронит второй процесс); одновременность исключает
  # только порядок запуска (stop shadow-run -> up shadow-live), замок экземпляра у них теперь раздельный.
  # Без LIVE_ALLOW_MAINNET=true (или USE_TESTNET=true) процесс откажется стартовать (ConfigError, код 3). Ключи Binance - ТОЛЬКО из .env.shadow на сервере.
  shadow-live:
    build: .
    command: ["python", "-m", "scripts.shadow_run"]
    profiles: ["live"]
    restart: on-failure:5
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BINANCE_PROFILE: mainnet
      TRADE_MODE: live
      TRADING_DATA_DIR: /app/data/live
      TRADING_LOG_DIR: /app/logs/live
      DATABASE_URL: postgresql://tradeai:${POSTGRES_PASSWORD:-}@postgres:5432/tradeai
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      USE_TESTNET: ${USE_TESTNET:-false}
      LIVE_ALLOW_MAINNET: ${LIVE_ALLOW_MAINNET:-false}
      APPROVED_STRATEGIES: ${APPROVED_STRATEGIES:-SMC_Pro_Trend}
      LIVE_MARGIN_USDT: ${LIVE_MARGIN_USDT:-10}
      LIVE_LEVERAGE: ${LIVE_LEVERAGE:-10}
      LIVE_DAILY_LOSS_LIMIT_USDT: ${LIVE_DAILY_LOSS_LIMIT_USDT:-50}
      LIVE_MAX_OPEN_POSITIONS: ${LIVE_MAX_OPEN_POSITIONS:-4}
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
      CTRADER_ACCOUNT_ID: ${CTRADER_ACCOUNT_ID:-}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN:-}
      CTRADER_REFRESH_TOKEN: ${CTRADER_REFRESH_TOKEN:-}
      CTRADER_ENV: ${CTRADER_ENV:-auto}
      MT5_SYMBOL_MAP: ${MT5_SYMBOL_MAP:-}
    volumes:
      - ./data/live:/app/data/live
      - ./logs/live:/app/logs/live
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/app/data/live/.shadow_heartbeat') < 120 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # API мониторинга (Этап 6): читает PostgreSQL и отдаёт данные клиенту Flet (папка client/ на ПК, на сервер не попадает).
  #   REST: /api/stats, /api/trades, /api/trades/{id}/snapshot;  WebSocket: /ws/live_state;  /api/health - без ключа (healthcheck).
  # Безопасность (api/security.py):
  #   * все данные - только с заголовком X-API-Key (значение API_KEY из .env.shadow, его создаёт deploy/shadow.sh; пустой ключ =
  #     контейнер не стартует, код 3);
  #   * порт по умолчанию публикуется на ВСЕХ интерфейсах сервера: 0.0.0.0:8001 -> 8000 в контейнере (на сервере порт 8000 занят
  #     другой программой, поэтому наружу 8001). Клиент ходит напрямую http://<IP сервера>:8001, SSH-туннель не нужен. ВАЖНО: это
  #     обычный HTTP, ключ X-API-Key идёт по сети открытым текстом - защита только ключом и троттлингом перебора. Вернуть доступ
  #     только с самого сервера (SSH-туннель): API_BIND=127.0.0.1 в .env.shadow; сменить порт: API_PORT=... там же;
  #   * БД - только чтение (default_transaction_read_only), ключей биржи в контейнере нет, файловая система только для чтения,
  #     каталог ./data/shadow смонтирован :ro (из него читается «пульс» shadow-run), пользователь не root.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    profiles: ["shadow", "live"]
    # unless-stopped (2026-10-18): API мониторинга поднимается после любого падения и после перезагрузки сервера/Docker (не только «до 20 сбоев»);
    # остановленный вручную (`shadow.sh down`) не воскресает. Ключей биржи в нём нет, писать в БД он не может - бесконечный перезапуск безопасен.
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradeai:${POSTGRES_PASSWORD:-}@postgres:5432/tradeai
      API_KEY: ${API_KEY:-}
      SHADOW_DATA_DIR: /app/data/shadow
      LIVE_DATA_DIR: /app/data/live  # «пульс» боевого shadow-live; API берёт самый свежий из двух каталогов
      ANALYZER_URL: http://analyzer:8000  # прокси /api/analysis/* -> Strategy Quant Analyzer (профиль analytics); контейнера нет - прокси отвечает 503 analyzer_unavailable
      ANALYZER_TOKEN: ${API_KEY:-}  # общий секрет API и анализатора (заголовок X-Analyzer-Token); анализатор наружу не публикуется
      GOLDEN_SET_DIR: /app/data/golden_set  # эталонные сетапы по звёздочке клиента (json + png)
      PLAYGROUND_DIR: /app/data/playground  # Playground: очередь и история прогонов по истории (SQLite; считает контейнер playground)
      UPDATE_DIR: /app/data/updates  # version.json и TradeAI-Monitor.exe (кладёт client/build_exe.ps1 -Publish)
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8001}:8000"
    volumes:
      - ./data/shadow:/app/data/shadow:ro
      - ./data/live:/app/data/live:ro
      - ./data/updates:/app/data/updates:ro
      - ./data/playground:/app/data/playground  # Playground: API ставит прогон в очередь (запись в SQLite) и читает историю; свечи считает воркер
      - ./data/golden_set:/app/data/golden_set  # единственное место, куда API пишет файлы (shadow.sh создаёт каталог с правом записи)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------------------------------------------------------------------
  # Strategy Quant Analyzer (2026-10-18, CLAUDE.md разд. 3.17): ОТДЕЛЬНЫЙ сервис математического анализа сделок (FastAPI + Pandas).
  # Изоляция от бота: свой образ без кода бота и ключей биржи; профиль `analytics` (НЕ входит в up / up-live / автодеплой - его падение или
  # пересборка не могут сорвать выкатку бота); порт наружу НЕ публикуется (его зовёт только основной api по внутренней сети);
  # в БД бота - только SELECT ролью analyzer_ro (analyzer/sql/001_analyzer_ro.sql), снимок REPEATABLE READ + READ ONLY; свои данные
  # (задания, отчёты, версии, календарь новостей) - SQLite в томе analyzer_data. Лимиты: 1 CPU, 1 ГБ, низкий приоритет воркера (nice 19).
  # Запуск: ./deploy/shadow.sh analyzer-init (один раз: пароль роли + SQL), затем ./deploy/shadow.sh analyzer-up.
  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    profiles: ["analytics"]
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://analyzer_ro@postgres:5432/tradeai  # без пароля: его достраивает analyzer/config.py из ANALYZER_DB_PASSWORD (с кодированием)
      ANALYZER_DB_PASSWORD: ${ANALYZER_DB_PASSWORD:-}  # пусто -> анализатор не стартует (код 3): ./deploy/shadow.sh analyzer-init
      ANALYZER_TOKEN: ${API_KEY:-}
      ANALYZER_DATA_DIR: /data
      ANALYZER_INITIAL_EQUITY: ${ANALYZER_INITIAL_EQUITY:-10000}
    volumes:
      - analyzer_data:/data
      - ./data/live:/botdata/live:ro  # календарь новостей бота (.news_calendar.json): только чтение
      - ./data/shadow:/botdata/shadow:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Playground (2026-10-24): прогон стратегий бота по истории свеча за свечой (тем же кодом, что Shadow; playground/engine.py). Образ бота, но БЕЗ ключей
  # биржи и БД: только публичные свечи Binance (минутки, кэш в ./data/playground/klines) и свой SQLite. Профиль playground (не входит в up / up-live:
  # падение или пересборка не трогают бота; запуск - ./deploy/shadow.sh playground-up, его же вызывает apply.sh). Один прогон за раз, nice 19, лимиты CPU/RAM.
  playground:
    build: .
    command: ["python", "-m", "playground.worker"]
    profiles: ["playground"]
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      BINANCE_PROFILE: mainnet
      PLAYGROUND_DIR: /app/data/playground
      TRADING_DATA_DIR: /app/data/playground
      TRADING_LOG_DIR: /tmp
    volumes:
      - ./data/playground:/app/data/playground
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5

  # Веб-версия клиента для телефона (2026-10-20, профиль web; не входит в up / up-live: падение или пересборка веба не трогают бота. Запуск: ./deploy/shadow.sh web-up,
  # его же вызывает apply.sh после обновления). web - Flet web (без ключей биржи; ключ API бота - из окружения, в браузер не попадает), вход по WEB_LOGIN / WEB_PASSWORD
  # из .env.shadow. nginx - единственный, кто опубликован наружу (порт WEB_PUBLIC_PORT, по умолчанию 8080), WebSocket проксируется.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    profiles: ["web"]
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      WEB_LOGIN: ${WEB_LOGIN:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      TRADEAI_API_KEY: ${API_KEY:-}
      TRADEAI_API_URL: http://api:8000
      WEB_PORT: "8550"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8550/', timeout=8).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      - web
    # HTTPS (2026-10-23, deploy/init-ssl.sh): 8080 - прежний HTTP-вход (после включения HTTPS закрывают: WEB_BIND=127.0.0.1); 8081 - «порт 80» (ТОЛЬКО acme-challenge Let's Encrypt
    # и 301 на https://193.233.75.254.nip.io); 8443 - «порт 443» (TLS). По умолчанию 8081/8443 слушают только localhost: init-ssl.sh сам выставляет WEB_HTTP_BIND=0.0.0.0,
    # WEB_HTTP_PORT=80 и WEB_HTTPS_PORT=443, если порты сервера свободны (на VPS с Caddy на :80/:443 вместо этого используется блок deploy/caddy-tradeai.caddy).
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PUBLIC_PORT:-8080}:8080"
      - "${WEB_HTTP_BIND:-127.0.0.1}:${WEB_HTTP_PORT:-8081}:8081"
      - "${WEB_HTTPS_BIND:-127.0.0.1}:${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/nginx-locations.inc:/etc/nginx/snippets/locations.inc:ro
      - ./data/certbot/ssl.d:/etc/nginx/ssl.d:ro  # HTTPS-сервер (пусто, пока init-ssl.sh не получил сертификат)
      - ./data/certbot/conf:/etc/letsencrypt:ro  # сертификаты (пишет certbot)
      - ./data/certbot/www:/var/www/certbot:ro  # webroot для проверки Let's Encrypt (пишет certbot)
    # раз в 6 часов nginx перечитывает конфиг и сертификаты: продлённый certbot'ом сертификат подхватывается без перезапуска контейнера
    command: ["/bin/sh", "-c", "(while :; do sleep 21600; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

  # Сертификаты Let's Encrypt для 193.233.75.254.nip.io (профиль `ssl`; запускает deploy/init-ssl.sh). Первый сертификат - `certbot certonly --webroot` из скрипта, дальше
  # этот контейнер два раза в сутки вызывает `certbot renew` (продлевается только то, что истекает меньше чем через 30 дней). Общие каталоги с nginx: webroot и /etc/letsencrypt.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["ssl"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

volumes:
  pgdata:
  analyzer_data:
