# HTTPS-сервер (внутри контейнера порт 8443 = «443» снаружи). Копируется deploy/init-ssl.sh в data/certbot/ssl.d/tradeai.conf после получения сертификата.
server {
    listen 8443 ssl;
    http2 on;
    server_name 193.233.75.254.nip.io;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/193.233.75.254.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.233.75.254.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # API мониторинга (десктопный клиент): REST и WebSocket живого состояния на том же адресе, /api/... и wss://.../ws/live_state
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/live_state {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    include /etc/nginx/snippets/locations.inc;
}
