# Прокси веб-версии клиента (контейнер nginx, профиль compose `web`). Три слушателя внутри контейнера (контейнер не root, поэтому порты > 1024):
#   8080 - прежний HTTP-вход прямо на приложение (после включения HTTPS его закрывают: WEB_BIND=127.0.0.1; за Caddy - upstream);
#   8081 - «порт 80»: ТОЛЬКО проверка Let's Encrypt (/.well-known/acme-challenge/) и 301-редирект всего остального на https://193.233.75.254.nip.io;
#   8443 - «порт 443»: TLS, сертификаты из /etc/letsencrypt, прокси на web (Flet, WSS) и api (FastAPI). Блок лежит отдельным файлом
#          (web/nginx-ssl.conf -> data/certbot/ssl.d/tradeai.conf), его кладёт deploy/init-ssl.sh ПОСЛЕ получения сертификата: без файла nginx
#          стартует как раньше и деплой веба не ломается.
# Наружу порты публикуются в docker-compose.yml (WEB_PUBLIC_PORT / WEB_HTTP_PORT / WEB_HTTPS_PORT; на :80/:443 - только если они свободны).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/locations.inc;
}

server {
    listen 8081;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://193.233.75.254.nip.io$request_uri;
    }
}

include /etc/nginx/ssl.d/*.conf;
