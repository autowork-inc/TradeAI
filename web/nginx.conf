# Прокси веб-версии клиента (контейнер nginx, профиль compose `web`): внешний порт -> контейнер web (Flet, 8550), с поддержкой WebSocket.
# Адрес web разрешается на каждый запрос (resolver Docker): nginx стартует и тогда, когда web ещё пересобирается.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flet http://web:8550;

    # графики сделок: aiohttp-сервер внутри контейнера web (порт 8551, наружу не опубликован); ссылка /chart/<случайный id> живёт 1 час
    location /chart/ {
        set $charts http://web:8551;
        proxy_pass $charts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $flet;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
